# Prüft jeden PR und jeden Push auf main: Docker-Image bauen, Tests im Image ausführen,
# Container wie auf dem Server starten und die wichtigsten Seiten abrufen.
# Nur bei Push auf main und wenn alles grün ist: fertiges Image nach ghcr.io/<besitzer>/<repo>
# (latest + Commit), damit der Server nichts selbst bauen muss. Ein Fork veröffentlicht sein eigenes Image.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image bauen
        run: docker build -t satzball .

      - name: Tests im Image (gleiche Python-Version wie auf dem Server)
        run: docker run --rm -e DJANGO_DEBUG=1 satzball python manage.py test

      - name: Keine fehlenden Migrationen
        run: docker run --rm -e DJANGO_DEBUG=1 satzball python manage.py makemigrations --check --dry-run

      - name: Container starten wie in docs/betrieb.md
        run: |
          docker run -d --name satzball -p 8000:8000 -e DJANGO_ALLOWED_HOSTS=localhost satzball
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:8000/ && break
            sleep 1
          done

      - name: Seiten abrufen
        run: |
          curl -fsS http://localhost:8000/ | grep -q "Satzball"
          curl -fsS -o /dev/null http://localhost:8000/admin/login/
          curl -fsS -o /dev/null http://localhost:8000/static/img/logo.svg
          docker exec satzball python manage.py testturnier --teams 6 --spielplan
          curl -fsS http://localhost:8000/spielplan/ | grep -q "Probelauf"
          curl -fsS -o /dev/null http://localhost:8000/tabelle/

      - name: compose.yaml mit Caddy wie in docs/betrieb.md (ohne Domain, Image aus diesem Lauf)
        run: |
          docker rm -f satzball
          docker tag satzball ghcr.io/kootaro05/satzball:latest
          printf 'DJANGO_ALLOWED_HOSTS=localhost\nDJANGO_HTTPS=0\n' > satzball.env
          touch becherkoenig.env
          printf ':80 {\n\treverse_proxy satzball:8000\n}\n' > Caddyfile
          docker compose --profile satzball up -d
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost/ && break
            sleep 1
          done
          curl -fsS http://localhost/ | grep -q "Satzball"
          curl -fsS -o /dev/null http://localhost/admin/login/

      - name: Caddy-Vorlage gültig (mit der Caddy-Version aus compose.yaml)
        run: |
          docker cp docs/Caddyfile.example caddy:/tmp/Caddyfile.example
          docker exec caddy caddy validate --config /tmp/Caddyfile.example --adapter caddyfile

      - name: install.sh wie auf einem frischen Server (ohne Domain, mit Becherkönig, Image aus diesem Lauf)
        run: |
          docker compose down -v
          # Becherkönig mit dem Image aus diesem Lauf testen (das echte Fork-Image kennt neue Befehle erst nach dem Sync)
          docker tag satzball ghcr.io/dhsn-timberborn/becherkoenig:latest
          sudo git config --global --add safe.directory '*'
          IP=$(hostname -I | awk '{print $1}')
          # Antworten in der Reihenfolge der Fragen: Becherkönig, IP, 2 Domains, Verantwortlicher (4),
          # SMTP (ja, Server, Port, Benutzer, Passwort), Orga (Name, Mail, Passwort 2×), Testturnier.
          # Sonderzeichen ($, #, ', Leerzeichen) prüfen, dass die .env-Dateien richtig geschrieben werden.
          printf '%s\n' j "" "" "" "Erika O'Muster" "Musterweg 1" "12345 Musterstadt" "orga@example.invalid" \
            j smtp.example.invalid "" orga@example.invalid 'smtp$pw #1' \
            orga orga@example.invalid 'pro$be pass#wort' 'pro$be pass#wort' j > "$RUNNER_TEMP/antworten.txt"
          sudo SATZBALL_ZIEL="$RUNNER_TEMP/satzball" SATZBALL_QUELLE="$GITHUB_WORKSPACE" \
            SATZBALL_EINGABE="$RUNNER_TEMP/antworten.txt" bash install.sh
          curl -fsS "http://$IP/" | grep -q "Probelauf"
          curl -fsS "http://$IP:8080/" | grep -q "Probelauf"
          curl -fsS "http://$IP/datenschutz/" | grep -q "Musterweg 1"
          test "$(docker exec satzball printenv EMAIL_HOST_PASSWORD)" = 'smtp$pw #1'
          test "$(docker exec becherkoenig printenv SATZBALL_VERANTWORTLICHER)" = "Erika O'Muster | Musterweg 1 | 12345 Musterstadt | E-Mail: orga@example.invalid"
          test "$(docker exec becherkoenig printenv DEFAULT_FROM_EMAIL)" = "Becherkönig <orga@example.invalid>"
          for app in satzball becherkoenig; do
            docker exec "$app" python manage.py shell -c "from django.contrib.auth.models import User; assert User.objects.get(username='orga').check_password('pro\$be pass#wort')"
          done
          docker exec becherkoenig python manage.py shell -c "from tournament.models import Turnier; assert Turnier.objects.get().zaehlmodus == 'becher'"
          test "$(sudo crontab -l | grep -c 'manage.py sicherung')" = 2

      - name: Image veröffentlichen (nur main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:latest" -t "$IMAGE:$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Container-Log bei Fehler
        if: failure()
        run: |
          docker logs satzball || true
          docker logs caddy || true
